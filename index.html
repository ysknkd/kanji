<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>手書き漢字認識</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>手書き漢字認識</h1>
        <div id="auth-container"></div>
      </header>

      <main>
        <div id="canvas-container">
          <canvas id="drawing-canvas" width="280" height="280"></canvas>
          <div id="canvas-hint">
            <span>タップして描画開始</span>
          </div>
        </div>

        <div id="button-container">
          <button id="clear-btn">消去</button>
          <button id="recognize-btn" disabled>認識</button>
        </div>

        <div id="status">モデル読み込み中...</div>

        <div id="results-container">
          <h2>認識結果</h2>
          <div id="results"></div>
        </div>

        <div id="compound-form-container">
          <h2>熟語を登録</h2>
          <form id="compound-form">
            <div class="form-row">
              <label for="compound-input">熟語</label>
              <div class="input-with-button">
                <input type="text" id="compound-input" placeholder="例: 今日" required />
                <button type="button" id="lookup-btn">検索</button>
              </div>
            </div>
            <div id="lookup-status"></div>
            <div class="form-row">
              <label for="reading-input">読み</label>
              <input type="text" id="reading-input" placeholder="自動入力されます" required />
            </div>
            <div class="form-row">
              <label for="meaning-input">意味</label>
              <input type="text" id="meaning-input" placeholder="自動入力されます" />
            </div>
            <button type="submit" id="save-compound-btn">登録</button>
          </form>
        </div>

        <div id="compounds-container">
          <h2>保存した熟語</h2>
          <div id="compounds"></div>
        </div>

        <div id="login-prompt">
          <p>ログインするとさらに便利に:</p>
          <ul>
            <li>100件以上の漢字を保存</li>
            <li>他のデバイスでも同じデータを閲覧</li>
          </ul>
        </div>

        <div id="history-container">
          <h2>保存した漢字</h2>
          <div id="history"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
